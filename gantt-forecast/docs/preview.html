<!doctype html><html lang="ru"><meta charset="utf-8"><title>Гантт ТМХИ — проверка прогноза</title>
<style>body{margin:24px;font:15px Calibri,Segoe UI,sans-serif;color:#242424}h1{color:#004F9E;font-size:24px}p{max-width:1000px}#visual{position:relative;width:min(100%,1000px);height:260px;border:1px solid #ccc}button{margin:8px;padding:8px}#status{white-space:pre-wrap}</style>
<link rel="stylesheet" href="../.tmp/visual.css"><h1>План и прогноз завершения</h1><p>Локальная проверка реального кода визуала с имитацией API хоста. Это не проверка в Power BI. Работа А — поздний прогноз, работа Б — ранний.</p><button id="toggle">Без прогноза / с прогнозом</button><button id="contrast">Высокий контраст</button><button id="labels">Подписи дат</button><p><label for="lineStyle">Вид линии прогноза: </label><select id="lineStyle"><option value="striped">Вертикальная штриховка</option><option value="solid">Сплошная заливка</option><option value="diagonal">Диагональная штриховка</option><option value="dashed">Пунктирная линия</option><option value="dotted">Точечная линия</option></select></p><p><label><input id="manualSize" type="checkbox" checked> Ручные размеры</label> <label>Линия, px <input id="lineSize" type="number" min="1" max="64" value="8" style="width:50px"></label> <label>Маркер, px <input id="markerSize" type="number" min="4" max="96" value="40" style="width:50px"></label> <label>Толщина маркера <input id="markerWidth" type="number" min="1" max="16" value="5" style="width:50px"></label></p><p><label><input id="daxColor" type="checkbox" checked> Цвет из меры (тестовые значения)</label></p><div id="visual"></div><pre id="status"></pre>
<script>window.powerbi={visuals:{plugins:{}}};</script><script src="../.tmp/visual.js"></script><script>
const w=window; let selections=[];const events={clicks:[],menus:[],tooltips:[],persist:[]};
 const host={locale:'ru-RU',colorPalette:{isHighContrast:false,foreground:{value:'#242424'},background:{value:'#FFFFFF'},getColor:()=>({value:'#004F9E'})},
  createLocalizationManager:()=>({getDisplayName:key=>key}),
  eventService:{renderingStarted(){},renderingFinished(){},renderingFailed(){}},
  tooltipService:{enabled:()=>true,show:e=>events.tooltips.push(e),hide(){},move(){}},
  createSelectionIdBuilder(){let key;return {withCategory(c,i){key=c.identity?.[i]?.key??String(i);return this;},withMeasure(){return this;},withSeries(){return this;},createSelectionId(){return {getKey:()=>key,getSelector:()=>({data:[{scopeId:key}]}),getSelectorsByColumn:()=>({dataMap:{row:key}}),equals:o=>o.getKey()===key,includes:o=>o.getKey()===key,hasIdentity:()=>true};}};},
  createSelectionManager:()=>({select(id,multi){events.clicks.push({key:id.getKey(),multi});selections=multi?[...selections,id]:[id];return Promise.resolve(selections);},clear(){selections=[];return Promise.resolve([]);},getSelectionIds:()=>selections,hasSelection:()=>!!selections.length,showContextMenu(id,position){events.menus.push({id,position});return Promise.resolve();},registerOnSelectCallback(){}}),
  persistProperties:p=>events.persist.push(p),launchUrl(){},displayWarningIcon(){},instanceId:'test'};
 const element=w.document.querySelector('#visual');
 const visual=w.powerbi.visuals.plugins.ganttTMHI84F997DD65FE42E9AAE536431246AB90.create({element,host});
 function data(withForecast=true){
  const cols=[['items',['Работа А','Работа Б'],{text:true}],['froms',[new w.Date(2026,0,1),new w.Date(2026,0,5)],{dateTime:true}],['tos',[new w.Date(2026,1,1),new w.Date(2026,1,5)],{dateTime:true}]];
  if(withForecast)cols.push(['forecastEnd',[new w.Date(2026,2,1),new w.Date(2026,0,20)],{dateTime:true}]);
  const categories=cols.map(([r,values,type],index)=>({source:{displayName:r,queryName:'Tasks.'+r,roles:{[r]:true},rolesIndex:{[r]:[0]},type,index},values,identity:values.map((_,i)=>({key:'task-'+i,getKey(){return this.key;}}))}));
  return {type:2,viewMode:1,viewport:{width:1000,height:500},dataViews:[{metadata:{columns:categories.map(c=>c.source),objects:{tmhiCurrent:{enabled:false},tmhiLevel:{enabled:false},tmhiPanel:{enabled:false},zooming:{focusOnToday:false},textValues:{show:true},enableTooltip:{show:false}}},categorical:{categories}}]};
 }

let forecast=true,contrast=false,labels=false;function draw(){const e=data(forecast);e.viewport={width:element.clientWidth,height:260};e.dataViews[0].metadata.objects.forecast={show:true,showLabel:labels,style:document.querySelector('#lineStyle').value,autoThickness:!document.querySelector('#manualSize').checked,lineThickness:Number(document.querySelector('#lineSize').value),autoMarkerSize:!document.querySelector('#manualSize').checked,markerSize:Number(document.querySelector('#markerSize').value),markerWidth:Number(document.querySelector('#markerWidth').value)};e.dataViews[0].metadata.objects.textValues={show:true,defaultColorA:{solid:{color:"#004F9E"}},barsOffset:45};e.dataViews[0].metadata.objects.zooming={focusOnToday:false,verticalZoomByItemSize:true,verticalZoomItemSize:48};if(document.querySelector('#daxColor').checked){const source={displayName:'Цвет прогноза',queryName:'Tasks.ForecastColor',roles:{forecastColor:true},type:{text:true}};e.dataViews[0].categorical.values=[{source,values:['#D23100','#176B34']}];e.dataViews[0].metadata.columns.push(source);}host.colorPalette.isHighContrast=contrast;host.colorPalette.foreground.value=contrast?'#FFFFFF':'#242424';host.colorPalette.background.value=contrast?'#000000':'#FFFFFF';element.style.background=contrast?'#000000':'#FFFFFF';visual.update(e);setTimeout(()=>{document.querySelector('#status').textContent='Продолжений: '+element.querySelectorAll('.forecast-extension').length+'; маркеров: '+element.querySelectorAll('.forecast-marker').length+'; карточек настроек: '+visual.getFormattingModel().cards.length;},1500);}
for(const id of ['lineStyle','manualSize','lineSize','markerSize','markerWidth','daxColor'])document.querySelector('#'+id).onchange=draw;document.querySelector('#toggle').onclick=()=>{forecast=!forecast;draw()};document.querySelector('#contrast').onclick=()=>{contrast=!contrast;draw()};document.querySelector('#labels').onclick=()=>{labels=!labels;draw()};draw();
</script></html>
